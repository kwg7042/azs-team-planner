<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 256 256">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0a1020" flood-opacity="0.5"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigglow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#d8f3ff" stop-opacity="0.9"/><stop offset="0.5" stop-color="#7cc8ff" stop-opacity="0.35"/><stop offset="1" stop-color="#7cc8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="0.5" stop-color="#8fd8ff"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
    <radialGradient id="fur" cx="45%" cy="32%" r="72%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.55" stop-color="#e8eef6"/><stop offset="1" stop-color="#9eabbd"/></radialGradient>
    <radialGradient id="ear" cx="50%" cy="60%" r="60%"><stop offset="0" stop-color="#f3c3cf"/><stop offset="1" stop-color="#b9788b"/></radialGradient>
    <radialGradient id="iris" cx="40%" cy="40%" r="65%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.35" stop-color="#7fe6ff"/><stop offset="1" stop-color="#0a7fd0"/></radialGradient>
