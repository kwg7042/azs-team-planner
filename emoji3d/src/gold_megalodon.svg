<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 256 256">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0a1020" flood-opacity="0.5"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigglow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7d97b3"/><stop offset="0.45" stop-color="#3d5570"/><stop offset="1" stop-color="#1a2636"/></linearGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8eef5"/><stop offset="1" stop-color="#9fb0c4"/></linearGradient>
    <radialGradient id="mouth" cx="50%" cy="45%" r="60%"><stop offset="0" stop-color="#1a0004"/><stop offset="0.7" stop-color="#5a0612"/><stop offset="1" stop-color="#a3152a"/></radialGradient>
    <linearGradient id="tooth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d8d2bf"/></linearGradient>
    <radialGradient id="eye" cx="40%" cy="40%" r="60%"><stop offset="0" stop-color="#3a3a3a"/><stop offset="1" stop-color="#000"/></radialGradient>
    <radialGradient id="splash" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#bfe9ff" stop-opacity="0.6"/><stop offset="1" stop-color="#3a8ad0" stop-opacity="0"/></radialGradient>
  </defs>
  <circle cx="128" cy="140" r="122" fill="url(#splash)"/>
