<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 256 256">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0a1020" flood-opacity="0.5"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigglow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <radialGradient id="aura" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffe0a0" stop-opacity="0.9"/><stop offset="0.5" stop-color="#ff6a2a" stop-opacity="0.35"/><stop offset="1" stop-color="#ff6a2a" stop-opacity="0"/></radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff2a8"/><stop offset="0.5" stop-color="#ff5a2a"/><stop offset="1" stop-color="#fff2a8"/></linearGradient>
    <linearGradient id="wing" x1="1" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#c8102e"/><stop offset="0.55" stop-color="#ff5a1f"/><stop offset="1" stop-color="#ffd23f"/></linearGradient>
    <linearGradient id="wing2" x1="1" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff7a1a"/><stop offset="1" stop-color="#fff0a0"/></linearGradient>
    <linearGradient id="tail" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c8102e"/><stop offset="0.6" stop-color="#ff6a1f"/><stop offset="1" stop-color="#ffd23f"/></linearGradient>
    <radialGradient id="body" cx="45%" cy="30%" r="70%"><stop offset="0" stop-color="#ff7a5a"/><stop offset="0.5" stop-color="#e01b2f"/><stop offset="1" stop-color="#7a0618"/></radialGradient>
    <linearGradient id="chest" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff0a0"/><stop offset="1" stop-color="#ff9a1f"/></linearGradient>
    <linearGradient id="beak" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff2b0"/><stop offset="1" stop-color="#e09a12"/></linearGradient>
    <radialGradient id="eye" cx="45%" cy="40%" r="65%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.4" stop-color="#ffe34a"/><stop offset="1" stop-color="#ff8a00"/></radialGradient>
    <radialGradient id="spot" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#18c7d8"/><stop offset="0.55" stop-color="#0b5e9c"/><stop offset="0.6" stop-color="#ffd23f"/><stop offset="1" stop-color="#ff9a1f"/></radialGradient>
    <g id="wingL">
      <path d="M112 120 C90 96 62 78 18 70 C40 84 52 92 60 100 C36 98 18 104 4 116 C28 114 46 116 58 122 C38 128 24 140 16 156 C36 146 56 142 72 144 C60 154 54 166 52 180 C70 164 88 154 108 150 Z" fill="url(#wing)" stroke="#8a0a1e" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M110 124 C92 108 72 98 46 92 C64 104 74 112 80 120 C64 120 52 124 42 132 C60 132 74 134 84 138 C74 146 68 154 66 164 C80 154 94 148 108 146 Z" fill="url(#wing2)" opacity="0.85"/>
    </g>
    <g id="eyeL">
      <path d="M104 92 C110 86 120 86 124 92 C120 98 110 98 104 92 Z" fill="#2a0508"/>
      <path d="M106 92 C111 88 119 88 122 92 C119 96 111 96 106 92 Z" fill="url(#eye)" filter="url(#glow)"/>
      <circle cx="114" cy="92" r="2" fill="#2a0508"/>
      <path d="M100 84 C108 80 118 82 126 88 C116 86 108 86 100 90 Z" fill="#5a0410"/>
    </g>
  </defs>
  <circle cx="128" cy="128" r="126" fill="url(#aura)"/>
  <circle cx="128" cy="124" r="104" fill="none" stroke="url(#ring)" stroke-width="5" opacity="0.9" filter="url(#glow)"/>
  <g filter="url(#soft)">
    <!-- 꼬리 깃털 -->
    <path d="M118 170 C104 196 88 220 70 244 C92 236 108 222 118 206 Z" fill="url(#tail)" stroke="#8a0a1e" stroke-width="1.5"/>
    <path d="M138 170 C152 196 168 220 186 244 C164 236 148 222 138 206 Z" fill="url(#tail)" stroke="#8a0a1e" stroke-width="1.5"/>
    <path d="M120 172 C116 200 118 226 128 252 C138 226 140 200 136 172 Z" fill="url(#tail)" stroke="#8a0a1e" stroke-width="1.5"/>
    <circle cx="128" cy="228" r="8" fill="url(#spot)"/>
    <circle cx="92" cy="224" r="6" fill="url(#spot)"/>
    <circle cx="164" cy="224" r="6" fill="url(#spot)"/>
    <!-- 날개 -->
    <use xlink:href="#wingL"/>
    <use xlink:href="#wingL" transform="translate(256 0) scale(-1 1)"/>
    <!-- 몸 -->
    <path d="M128 92 C154 92 166 120 162 150 C158 174 144 186 128 186 C112 186 98 174 94 150 C90 120 102 92 128 92 Z" fill="url(#body)" stroke="#6a0414" stroke-width="2"/>
    <!-- 가슴 깃털 -->
    <g fill="url(#chest)" stroke="#d4570e" stroke-width="1">
      <path d="M112 124 q8 10 16 0 q8 10 16 0 q-2 12 -16 14 q-14 -2 -16 -14z"/>
      <path d="M114 142 q7 9 14 0 q7 9 14 0 q-2 11 -14 13 q-12 -2 -14 -13z"/>
      <path d="M118 158 q5 8 10 0 q5 8 10 0 q-2 10 -10 11 q-8 -1 -10 -11z"/>
    </g>
    <!-- 볏 -->
    <path d="M118 62 C110 44 112 30 120 18 C122 32 126 40 128 48 C130 36 136 26 146 16 C146 32 142 46 138 60 C144 52 152 48 162 46 C154 56 146 64 138 70 Z" fill="url(#wing)" stroke="#8a0a1e" stroke-width="1.5"/>
    <!-- 머리 -->
    <circle cx="128" cy="90" r="30" fill="url(#body)" stroke="#6a0414" stroke-width="2"/>
    <ellipse cx="120" cy="78" rx="12" ry="6" fill="#fff" opacity="0.25"/>
    <use xlink:href="#eyeL"/>
    <use xlink:href="#eyeL" transform="translate(256 0) scale(-1 1)"/>
    <!-- 부리 -->
    <path d="M118 100 C122 96 134 96 138 100 L128 122 Z" fill="url(#beak)" stroke="#a8660a" stroke-width="1.5"/>
  </g>
  <!-- 불씨 -->
  <g fill="#ffd23f" filter="url(#glow)" opacity="0.95">
    <path d="M36 196 c4 -6 2 -12 -2 -16 c8 2 12 10 8 18 c-2 4 -8 2 -6 -2z"/>
    <path d="M220 190 c-4 -6 -2 -12 2 -16 c-8 2 -12 10 -8 18 c2 4 8 2 6 -2z"/>
    <circle cx="200" cy="40" r="3"/><circle cx="58" cy="44" r="2.5"/>
  </g>
</svg>