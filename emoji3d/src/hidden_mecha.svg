<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 256 256">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0a1020" flood-opacity="0.5"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigglow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <clipPath id="rr"><rect x="0" y="0" width="256" height="256" rx="34"/></clipPath>
    <radialGradient id="vign" cx="50%" cy="45%" r="70%"><stop offset="0.55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.75"/></radialGradient>
    <radialGradient id="bg2" cx="50%" cy="45%" r="70%"><stop offset="0" stop-color="#ffb04a"/><stop offset="0.25" stop-color="#e2461a"/><stop offset="0.6" stop-color="#2a0f2a"/><stop offset="1" stop-color="#05040c"/></radialGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef3fa"/><stop offset="0.35" stop-color="#8f9bb0"/><stop offset="0.7" stop-color="#3a4256"/><stop offset="1" stop-color="#151925"/></linearGradient>
    <linearGradient id="steel2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a6680"/><stop offset="1" stop-color="#121624"/></linearGradient>
    <linearGradient id="gold2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff2a8"/><stop offset="0.5" stop-color="#ffc22a"/><stop offset="1" stop-color="#a85e0a"/></linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00e5ff" stop-opacity="0.2"/><stop offset="0.5" stop-color="#e6ffff"/><stop offset="1" stop-color="#00e5ff" stop-opacity="0.2"/></linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.4" stop-color="#7ff6ff"/><stop offset="1" stop-color="#0a8fd0" stop-opacity="0"/></radialGradient>
    <g id="halfM">
      <path d="M128 40 L92 60 L80 100 L84 140 L104 166 L128 172 Z" fill="url(#steel)" stroke="#0a0d16" stroke-width="2"/>
      <path d="M86 100 L60 92 L48 120 L62 150 L84 140 Z" fill="url(#steel2)" stroke="#0a0d16" stroke-width="2"/>
      <path d="M126 46 L104 18 L60 0 L98 30 L118 52 Z" fill="url(#gold2)" stroke="#6a3a06" stroke-width="1.5"/>
      <path d="M40 196 L92 176 L110 200 L104 256 L20 256 L16 220 Z" fill="url(#steel2)" stroke="#0a0d16" stroke-width="2"/>
      <path d="M44 204 L88 188" stroke="#00e5ff" stroke-width="2.5" opacity="0.8" filter="url(#glow)"/>
      <path d="M96 120 L120 124" stroke="#ff3a2a" stroke-width="2" opacity="0.8"/>
    </g>
  </defs>
  <g clip-path="url(#rr)">
    <rect width="256" height="256" fill="url(#bg2)"/>
    <g stroke="#ffcf7a" stroke-width="1.2" opacity="0.35"><line x1="128" y1="110" x2="328" y2="110"/><line x1="128" y1="110" x2="321" y2="162"/><line x1="128" y1="110" x2="301" y2="210"/><line x1="128" y1="110" x2="269" y2="251"/><line x1="128" y1="110" x2="228" y2="283"/><line x1="128" y1="110" x2="180" y2="303"/><line x1="128" y1="110" x2="128" y2="310"/><line x1="128" y1="110" x2="76" y2="303"/><line x1="128" y1="110" x2="28" y2="283"/><line x1="128" y1="110" x2="-13" y2="251"/><line x1="128" y1="110" x2="-45" y2="210"/><line x1="128" y1="110" x2="-65" y2="162"/><line x1="128" y1="110" x2="-72" y2="110"/><line x1="128" y1="110" x2="-65" y2="58"/><line x1="128" y1="110" x2="-45" y2="10"/><line x1="128" y1="110" x2="-13" y2="-31"/><line x1="128" y1="110" x2="28" y2="-63"/><line x1="128" y1="110" x2="76" y2="-83"/><line x1="128" y1="110" x2="128" y2="-90"/><line x1="128" y1="110" x2="180" y2="-83"/><line x1="128" y1="110" x2="228" y2="-63"/><line x1="128" y1="110" x2="269" y2="-31"/><line x1="128" y1="110" x2="301" y2="10"/><line x1="128" y1="110" x2="321" y2="58"/></g>
    <circle cx="217" cy="180" r="0.8" fill="#ffe0b0" opacity="0.62"/><circle cx="47" cy="199" r="1.1" fill="#ffe0b0" opacity="0.87"/><circle cx="86" cy="62" r="1.4" fill="#ffe0b0" opacity="0.99"/><circle cx="214" cy="208" r="1.4" fill="#ffe0b0" opacity="0.84"/><circle cx="61" cy="135" r="0.9" fill="#ffe0b0" opacity="0.42"/><circle cx="13" cy="76" r="0.8" fill="#ffe0b0" opacity="0.82"/><circle cx="239" cy="118" r="1.5" fill="#ffe0b0" opacity="0.99"/><circle cx="239" cy="97" r="0.7" fill="#ffe0b0" opacity="0.54"/><circle cx="54" cy="57" r="1.2" fill="#ffe0b0" opacity="0.94"/><circle cx="211" cy="126" r="1.2" fill="#ffe0b0" opacity="0.88"/><circle cx="27" cy="171" r="1.5" fill="#ffe0b0" opacity="0.87"/><circle cx="189" cy="126" r="0.7" fill="#ffe0b0" opacity="0.87"/><circle cx="87" cy="206" r="1.6" fill="#ffe0b0" opacity="0.64"/><circle cx="104" cy="243" r="1.3" fill="#ffe0b0" opacity="0.50"/><circle cx="37" cy="44" r="1.5" fill="#ffe0b0" opacity="0.88"/><circle cx="42" cy="213" r="1.6" fill="#ffe0b0" opacity="0.79"/><circle cx="91" cy="143" r="0.6" fill="#ffe0b0" opacity="0.41"/><circle cx="243" cy="168" r="1.1" fill="#ffe0b0" opacity="0.96"/><circle cx="112" cy="224" r="1.4" fill="#ffe0b0" opacity="0.53"/><circle cx="67" cy="79" r="0.8" fill="#ffe0b0" opacity="0.75"/><circle cx="69" cy="111" r="0.6" fill="#ffe0b0" opacity="0.95"/><circle cx="92" cy="121" r="1.1" fill="#ffe0b0" opacity="0.94"/><circle cx="109" cy="235" r="1.1" fill="#ffe0b0" opacity="0.72"/><circle cx="134" cy="11" r="1.0" fill="#ffe0b0" opacity="0.51"/><circle cx="7" cy="206" r="0.7" fill="#ffe0b0" opacity="0.68"/>
    <use xlink:href="#halfM"/><use xlink:href="#halfM" transform="translate(256 0) scale(-1 1)"/>
    <!-- 이마 보석 -->
    <path d="M128 52 L138 66 L128 80 L118 66 Z" fill="#ff2a3a" stroke="#ffe0e0" stroke-width="1.5" filter="url(#glow)"/>
    <!-- 바이저 -->
    <path d="M90 104 L128 112 L166 104 L162 120 L128 128 L94 120 Z" fill="#05141c" stroke="#0a0d16" stroke-width="2"/>
    <path d="M96 110 L128 117 L160 110 L158 116 L128 123 L98 116 Z" fill="url(#visor)" filter="url(#glow)"/>
    <!-- 입 그릴 -->
    <g stroke="#0a0d16" stroke-width="2.5"><line x1="116" y1="146" x2="116" y2="160"/><line x1="128" y1="148" x2="128" y2="164"/><line x1="140" y1="146" x2="140" y2="160"/></g>
    <!-- 가슴 코어 -->
    <path d="M100 196 L128 182 L156 196 L150 232 L128 244 L106 232 Z" fill="url(#steel2)" stroke="#0a0d16" stroke-width="2"/>
    <circle cx="128" cy="212" r="20" fill="url(#core)" filter="url(#glow)"/>
    <circle cx="128" cy="212" r="7" fill="#ffffff"/>
    <!-- 불꽃 스파크 -->
    <g stroke="#fff3a0" stroke-width="2" stroke-linecap="round" filter="url(#glow)"><line x1="30" y1="60" x2="40" y2="66"/><line x1="226" y1="56" x2="214" y2="64"/><line x1="236" y1="150" x2="224" y2="146"/></g>
    <rect width="256" height="256" fill="url(#vign)"/>
  </g>
  <rect x="3" y="3" width="250" height="250" rx="32" fill="none" stroke="#ffc22a" stroke-width="5" opacity="0.9"/>
</svg>