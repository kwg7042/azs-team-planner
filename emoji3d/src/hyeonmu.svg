<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 256 256">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0a1020" flood-opacity="0.5"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigglow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <radialGradient id="aura" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#d4c6ff" stop-opacity="0.85"/><stop offset="0.5" stop-color="#4a6fd0" stop-opacity="0.35"/><stop offset="1" stop-color="#4a6fd0" stop-opacity="0"/></radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e6f0ff"/><stop offset="0.5" stop-color="#8a7cff"/><stop offset="1" stop-color="#5fe0d0"/></linearGradient>
    <radialGradient id="shell" cx="45%" cy="20%" r="85%"><stop offset="0" stop-color="#4f97a3"/><stop offset="0.45" stop-color="#1b4b5c"/><stop offset="1" stop-color="#061620"/></radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6dc8a"/><stop offset="1" stop-color="#8a5a12"/></linearGradient>
    <radialGradient id="thead" cx="45%" cy="30%" r="75%"><stop offset="0" stop-color="#9fc7b6"/><stop offset="0.55" stop-color="#4f7a6a"/><stop offset="1" stop-color="#1c3229"/></radialGradient>
    <linearGradient id="limb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5f857a"/><stop offset="1" stop-color="#1f342d"/></linearGradient>
    <linearGradient id="snake" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6ff0aa"/><stop offset="0.5" stop-color="#1c8a5a"/><stop offset="1" stop-color="#0b3d2a"/></linearGradient>
    <radialGradient id="shead" cx="45%" cy="35%" r="70%"><stop offset="0" stop-color="#8af5b8"/><stop offset="0.6" stop-color="#1f9460"/><stop offset="1" stop-color="#0a3424"/></radialGradient>
    <radialGradient id="eye" cx="45%" cy="40%" r="65%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.4" stop-color="#fff04a"/><stop offset="1" stop-color="#ff9a00"/></radialGradient>
    <radialGradient id="teye" cx="45%" cy="40%" r="65%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.35" stop-color="#8ff8ff"/><stop offset="1" stop-color="#0a8fd0"/></radialGradient>
    <g id="legL">
      <path d="M50 160 C30 168 18 186 22 204 C34 210 52 204 62 190 Z" fill="url(#limb)" stroke="#16241f" stroke-width="1.5"/>
      <path d="M24 202 l-7 6 M31 206 l-5 9 M40 207 l-3 9" stroke="#efe6c4" stroke-width="2.8" stroke-linecap="round"/>
    </g>
    <g id="teyeL">
      <path d="M92 182 C98 172 112 172 118 182 C112 190 98 190 92 182 Z" fill="#06120f"/>
      <path d="M95 182 C100 175 110 175 115 182 C110 188 100 188 95 182 Z" fill="url(#teye)" filter="url(#glow)"/>
      <ellipse cx="105" cy="182" rx="2" ry="4.5" fill="#032030"/>
      <circle cx="101" cy="179" r="1.8" fill="#fff"/>
      <path d="M86 170 C98 162 112 164 122 174 C110 170 98 170 88 176 Z" fill="#14231d"/>
    </g>
    <g id="seyeL">
      <path d="M100 46 C106 38 118 38 123 47 C116 53 106 53 100 46 Z" fill="#06120f"/>
      <path d="M102 46 C107 40 117 41 121 47 C116 51 107 51 102 46 Z" fill="url(#eye)" filter="url(#glow)"/>
      <ellipse cx="112" cy="46" rx="1.8" ry="4.5" fill="#2a1400"/>
      <path d="M96 38 C106 32 118 34 126 42" stroke="#06261a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    </g>
  </defs>
  <circle cx="128" cy="128" r="126" fill="url(#aura)"/>
  <circle cx="128" cy="124" r="104" fill="none" stroke="url(#ring)" stroke-width="5" opacity="0.9" filter="url(#glow)"/>
  <g filter="url(#soft)">
    <!-- 뒤쪽 뱀 꼬리 -->
    <path d="M212 172 C236 152 236 120 216 104" fill="none" stroke="#0a2a1d" stroke-width="20" stroke-linecap="round"/>
    <path d="M212 172 C236 152 236 120 216 104" fill="none" stroke="url(#snake)" stroke-width="15" stroke-linecap="round"/>
    <use xlink:href="#legL"/>
    <use xlink:href="#legL" transform="translate(256 0) scale(-1 1)"/>
    <!-- 등딱지 (낮고 넓게) -->
    <path d="M30 162 C30 110 76 82 128 82 C180 82 226 110 226 162 C196 180 60 180 30 162 Z" fill="url(#shell)" stroke="#04121a" stroke-width="2.5"/>
    <path d="M147.1 134.6 L128.0 141.2 L108.9 134.6 L108.9 121.4 L128.0 114.8 L147.1 121.4 Z M104.5 139.7 L88.0 145.4 L71.5 139.7 L71.5 128.3 L88.0 122.6 L104.5 128.3 Z M184.5 139.7 L168.0 145.4 L151.5 139.7 L151.5 128.3 L168.0 122.6 L184.5 128.3 Z M122.7 113.1 L108.0 118.2 L93.3 113.1 L93.3 102.9 L108.0 97.8 L122.7 102.9 Z M162.7 113.1 L148.0 118.2 L133.3 113.1 L133.3 102.9 L148.0 97.8 L162.7 102.9 Z M73.3 153.9 L62.0 157.8 L50.7 153.9 L50.7 146.1 L62.0 142.2 L73.3 146.1 Z M205.3 153.9 L194.0 157.8 L182.7 153.9 L182.7 146.1 L194.0 142.2 L205.3 146.1 Z M117.9 156.8 L104.0 161.6 L90.1 156.8 L90.1 147.2 L104.0 142.4 L117.9 147.2 Z M165.9 156.8 L152.0 161.6 L138.1 156.8 L138.1 147.2 L152.0 142.4 L165.9 147.2 Z" fill="#2b6a78" fill-opacity="0.55" stroke="#6ff0e0" stroke-width="2" stroke-opacity="0.8"/>
    <path d="M30 162 C60 180 196 180 226 162 C224 172 218 178 212 182 C182 196 74 196 44 182 C38 178 32 172 30 162 Z" fill="url(#rim)" stroke="#6a420c" stroke-width="1.5"/>
    <ellipse cx="100" cy="100" rx="34" ry="9" fill="#fff" opacity="0.14" transform="rotate(-12 100 100)"/>
    <!-- 거북 머리: 크게 앞으로 -->
    <path d="M128 150 C160 150 176 168 174 190 C172 214 154 232 128 232 C102 232 84 214 82 190 C80 168 96 150 128 150 Z" fill="url(#thead)" stroke="#0f1d18" stroke-width="2.5"/>
    <ellipse cx="116" cy="162" rx="18" ry="6" fill="#fff" opacity="0.22"/>
    <use xlink:href="#teyeL"/>
    <use xlink:href="#teyeL" transform="translate(256 0) scale(-1 1)"/>
    <ellipse cx="121" cy="202" rx="2.6" ry="1.8" fill="#0f1d18"/><ellipse cx="135" cy="202" rx="2.6" ry="1.8" fill="#0f1d18"/>
    <path d="M100 210 C112 220 144 220 156 210 C150 222 140 228 128 228 C116 228 106 222 100 210 Z" fill="#14231d"/>
    <path d="M108 212 C118 218 138 218 148 212" stroke="#c9e8da" stroke-width="2" fill="none" opacity="0.6"/>
    <!-- 뱀 몸통 (등딱지를 휘감고 위로) -->
    <path d="M44 156 C18 112 60 84 104 92 C146 100 188 90 182 64 C176 44 150 40 136 50" fill="none" stroke="#0a2a1d" stroke-width="24" stroke-linecap="round"/>
    <path d="M44 156 C18 112 60 84 104 92 C146 100 188 90 182 64 C176 44 150 40 136 50" fill="none" stroke="url(#snake)" stroke-width="19" stroke-linecap="round"/>
    <path d="M44 156 C18 112 60 84 104 92 C146 100 188 90 182 64 C176 44 150 40 136 50" fill="none" stroke="#c9ffd8" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 7" opacity="0.5"/>
    <!-- 뱀 머리 (크게) -->
    <path d="M128 18 C156 18 168 34 166 52 C164 70 148 80 128 80 C108 80 92 70 90 52 C88 34 100 18 128 18 Z" fill="url(#shead)" stroke="#06261a" stroke-width="2.2"/>
    <ellipse cx="118" cy="28" rx="14" ry="5" fill="#fff" opacity="0.25"/>
    <use xlink:href="#seyeL"/>
    <use xlink:href="#seyeL" transform="translate(256 0) scale(-1 1)"/>
    <path d="M114 68 L118 80 L122 69 Z M142 68 L138 80 L134 69 Z" fill="#fff"/>
    <path d="M128 70 L128 88 L122 96 M128 88 L134 96" stroke="#ff2a4a" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>