<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 256 256">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0a1020" flood-opacity="0.5"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigglow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <radialGradient id="aura" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#c9b8ff" stop-opacity="0.8"/><stop offset="0.5" stop-color="#3a7fa8" stop-opacity="0.35"/><stop offset="1" stop-color="#3a7fa8" stop-opacity="0"/></radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e6f0ff"/><stop offset="0.5" stop-color="#7a6cff"/><stop offset="1" stop-color="#5fe0d0"/></linearGradient>
    <radialGradient id="shell" cx="45%" cy="25%" r="80%"><stop offset="0" stop-color="#4c8f9c"/><stop offset="0.45" stop-color="#1b4b5c"/><stop offset="1" stop-color="#071820"/></radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0d27a"/><stop offset="1" stop-color="#8a5a12"/></linearGradient>
    <linearGradient id="limb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a7a70"/><stop offset="1" stop-color="#22362f"/></linearGradient>
    <linearGradient id="snake" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5fe39a"/><stop offset="0.5" stop-color="#1c8a5a"/><stop offset="1" stop-color="#0b3d2a"/></linearGradient>
    <radialGradient id="shead" cx="45%" cy="35%" r="70%"><stop offset="0" stop-color="#7cf0aa"/><stop offset="0.6" stop-color="#1c8a5a"/><stop offset="1" stop-color="#0a3424"/></radialGradient>
    <radialGradient id="eye" cx="45%" cy="40%" r="65%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.4" stop-color="#fff04a"/><stop offset="1" stop-color="#ff9a00"/></radialGradient>
    <radialGradient id="teye" cx="45%" cy="40%" r="65%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.4" stop-color="#7ff6ff"/><stop offset="1" stop-color="#0a8fd0"/></radialGradient>
    <g id="legL">
      <path d="M58 176 C40 182 30 196 34 210 C44 214 58 210 66 200 Z" fill="url(#limb)" stroke="#16241f" stroke-width="1.5"/>
      <path d="M36 208 l-6 6 M42 211 l-4 8 M50 211 l-2 8" stroke="#e8e0c0" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M70 130 C52 120 38 122 30 132 C36 142 52 146 66 142 Z" fill="url(#limb)" stroke="#16241f" stroke-width="1.5"/>
    </g>
  </defs>
  <circle cx="128" cy="128" r="126" fill="url(#aura)"/>
  <circle cx="128" cy="124" r="104" fill="none" stroke="url(#ring)" stroke-width="5" opacity="0.9" filter="url(#glow)"/>
  <g filter="url(#soft)">
    <!-- 뒤쪽 뱀 꼬리 -->
    <path d="M206 186 C230 170 232 140 214 122" fill="none" stroke="#0a2a1d" stroke-width="20" stroke-linecap="round"/>
    <path d="M206 186 C230 170 232 140 214 122" fill="none" stroke="url(#snake)" stroke-width="15" stroke-linecap="round"/>
    <!-- 다리 -->
    <use xlink:href="#legL"/>
    <use xlink:href="#legL" transform="translate(256 0) scale(-1 1)"/>
    <!-- 등딱지 -->
    <path d="M36 176 C36 118 78 92 128 92 C178 92 220 118 220 176 C190 196 66 196 36 176 Z" fill="url(#shell)" stroke="#04121a" stroke-width="2.5"/>
    <path d="M148.8 157.4 L128.0 164.9 L107.2 157.4 L107.2 142.6 L128.0 135.1 L148.8 142.6 Z M103.3 164.2 L86.0 170.4 L68.7 164.2 L68.7 151.8 L86.0 145.6 L103.3 151.8 Z M187.3 164.2 L170.0 170.4 L152.7 164.2 L152.7 151.8 L170.0 145.6 L187.3 151.8 Z M122.5 131.9 L106.0 137.8 L89.5 131.9 L89.5 120.1 L106.0 114.2 L122.5 120.1 Z M166.5 131.9 L150.0 137.8 L133.5 131.9 L133.5 120.1 L150.0 114.2 L166.5 120.1 Z M123.6 185.6 L108.0 191.2 L92.4 185.6 L92.4 174.4 L108.0 168.8 L123.6 174.4 Z M163.6 185.6 L148.0 191.2 L132.4 185.6 L132.4 174.4 L148.0 168.8 L163.6 174.4 Z M82.1 184.3 L70.0 188.7 L57.9 184.3 L57.9 175.7 L70.0 171.3 L82.1 175.7 Z M198.1 184.3 L186.0 188.7 L173.9 184.3 L173.9 175.7 L186.0 171.3 L198.1 175.7 Z" fill="#2b6a78" fill-opacity="0.55" stroke="#6ff0e0" stroke-width="2" stroke-opacity="0.8"/>
    <path d="M36 176 C66 196 190 196 220 176 C218 186 212 192 206 196 C176 210 80 210 50 196 C44 192 38 186 36 176 Z" fill="url(#rim)" stroke="#6a420c" stroke-width="1.5"/>
    <!-- 거북 머리 -->
    <path d="M106 198 C106 184 150 184 150 198 C150 220 141 232 128 232 C115 232 106 220 106 198 Z" fill="url(#limb)" stroke="#16241f" stroke-width="1.5"/>
    <path d="M113 207 C117 202 124 204 125 209 C121 212 115 211 113 207 Z M143 207 C139 202 132 204 131 209 C135 212 141 211 143 207 Z" fill="url(#teye)" filter="url(#glow)"/>
    <path d="M119 222 C124 225 132 225 137 222" stroke="#0e1a16" stroke-width="2" fill="none" stroke-linecap="round"/>
    <ellipse cx="104" cy="112" rx="34" ry="10" fill="#ffffff" opacity="0.15" transform="rotate(-12 104 112)"/>
    <!-- 뱀 몸통 (등딱지를 휘감고 위로) -->
    <path d="M52 166 C26 120 66 96 110 104 C150 112 190 100 180 70 C172 48 146 44 132 56" fill="none" stroke="#0a2a1d" stroke-width="24" stroke-linecap="round"/>
    <path d="M52 166 C26 120 66 96 110 104 C150 112 190 100 180 70 C172 48 146 44 132 56" fill="none" stroke="url(#snake)" stroke-width="19" stroke-linecap="round"/>
    <path d="M52 166 C26 120 66 96 110 104 C150 112 190 100 180 70 C172 48 146 44 132 56" fill="none" stroke="#c9ffd8" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 7" opacity="0.55"/>
    <!-- 뱀 머리 -->
    <path d="M128 30 C150 30 160 44 158 58 C156 72 142 80 128 80 C114 80 100 72 98 58 C96 44 106 30 128 30 Z" fill="url(#shead)" stroke="#06261a" stroke-width="2"/>
    <path d="M106 50 C112 44 122 46 124 54 C116 58 108 56 106 50 Z M150 50 C144 44 134 46 132 54 C140 58 148 56 150 50 Z" fill="url(#eye)" filter="url(#glow)"/>
    <path d="M115 48 L116 56 M141 48 L140 56" stroke="#2a1400" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M104 42 C112 36 120 38 126 44 M152 42 C144 36 136 38 130 44" stroke="#06261a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- 송곳니 + 혀 -->
    <path d="M116 70 L119 80 L122 71 Z M140 70 L137 80 L134 71 Z" fill="#fff"/>
    <path d="M128 74 L128 90 L123 97 M128 90 L133 97" stroke="#e0263f" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>