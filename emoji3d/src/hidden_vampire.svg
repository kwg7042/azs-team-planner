<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 256 256">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0a1020" flood-opacity="0.5"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigglow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <clipPath id="rr"><rect x="0" y="0" width="256" height="256" rx="34"/></clipPath>
    <radialGradient id="vign" cx="50%" cy="45%" r="70%"><stop offset="0.55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.75"/></radialGradient>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a0614"/><stop offset="0.6" stop-color="#12040e"/><stop offset="1" stop-color="#050106"/></linearGradient>
    <radialGradient id="moon3" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffb3a0"/><stop offset="0.55" stop-color="#e01b2f"/><stop offset="0.85" stop-color="#7a0618"/><stop offset="1" stop-color="#7a0618" stop-opacity="0"/></radialGradient>
    <radialGradient id="face3" cx="45%" cy="35%" r="70%"><stop offset="0" stop-color="#f4eef4"/><stop offset="0.6" stop-color="#c9bccf"/><stop offset="1" stop-color="#6a5a74"/></radialGradient>
    <linearGradient id="cape3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a0a14"/><stop offset="1" stop-color="#050106"/></linearGradient>
    <linearGradient id="capein3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e01b2f"/><stop offset="1" stop-color="#5a0614"/></linearGradient>
    <radialGradient id="eye3" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.35" stop-color="#ff3a3a"/><stop offset="1" stop-color="#ff0000" stop-opacity="0"/></radialGradient>
    <g id="bat"><path d="M0 0 C-4 -6 -10 -8 -16 -6 C-12 -4 -11 -1 -12 2 C-8 0 -4 1 0 4 C4 1 8 0 12 2 C11 -1 12 -4 16 -6 C10 -8 4 -6 0 0 Z" fill="#050106"/></g>
    <g id="halfV">
      <!-- 높은 깃 -->
      <path d="M92 150 C70 120 56 92 40 60 C66 80 84 104 104 124 Z" fill="url(#capein3)" stroke="#ff6a6a" stroke-width="1.5" stroke-opacity="0.6"/>
      <path d="M128 256 L0 256 L0 214 C30 196 60 180 92 150 L110 170 L128 180 Z" fill="url(#cape3)" stroke="#ff4a5a" stroke-width="1.5" stroke-opacity="0.5"/>
      <!-- 눈 -->
      <path d="M100 116 C106 110 116 110 122 116 C116 120 106 120 100 116 Z" fill="url(#eye3)" filter="url(#glow)"/>
      <path d="M96 106 C106 100 116 102 124 110" stroke="#1a0812" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    </g>
  </defs>
  <g clip-path="url(#rr)">
    <rect width="256" height="256" fill="url(#bg3)"/>
    <circle cx="183" cy="86" r="0.8" fill="#ffd0d8" opacity="0.71"/><circle cx="142" cy="119" r="0.6" fill="#ffd0d8" opacity="0.74"/><circle cx="67" cy="46" r="1.1" fill="#ffd0d8" opacity="0.70"/><circle cx="143" cy="115" r="1.2" fill="#ffd0d8" opacity="0.67"/><circle cx="155" cy="79" r="0.9" fill="#ffd0d8" opacity="0.82"/><circle cx="116" cy="83" r="0.9" fill="#ffd0d8" opacity="0.96"/><circle cx="177" cy="132" r="1.3" fill="#ffd0d8" opacity="0.56"/><circle cx="143" cy="142" r="1.2" fill="#ffd0d8" opacity="0.48"/><circle cx="36" cy="70" r="0.6" fill="#ffd0d8" opacity="0.54"/><circle cx="24" cy="102" r="1.1" fill="#ffd0d8" opacity="0.94"/><circle cx="44" cy="109" r="1.0" fill="#ffd0d8" opacity="0.49"/><circle cx="221" cy="145" r="0.7" fill="#ffd0d8" opacity="0.97"/><circle cx="103" cy="76" r="1.3" fill="#ffd0d8" opacity="0.90"/><circle cx="45" cy="68" r="0.9" fill="#ffd0d8" opacity="0.60"/><circle cx="54" cy="52" r="1.1" fill="#ffd0d8" opacity="0.41"/><circle cx="141" cy="69" r="0.5" fill="#ffd0d8" opacity="0.60"/><circle cx="158" cy="80" r="0.6" fill="#ffd0d8" opacity="0.99"/><circle cx="198" cy="146" r="0.6" fill="#ffd0d8" opacity="0.56"/><circle cx="16" cy="118" r="0.7" fill="#ffd0d8" opacity="0.48"/><circle cx="109" cy="137" r="1.2" fill="#ffd0d8" opacity="0.56"/><circle cx="42" cy="138" r="1.0" fill="#ffd0d8" opacity="0.82"/><circle cx="28" cy="14" r="1.1" fill="#ffd0d8" opacity="0.66"/><circle cx="24" cy="141" r="1.0" fill="#ffd0d8" opacity="0.88"/><circle cx="26" cy="129" r="0.6" fill="#ffd0d8" opacity="0.92"/><circle cx="117" cy="55" r="0.9" fill="#ffd0d8" opacity="0.96"/><circle cx="71" cy="25" r="0.9" fill="#ffd0d8" opacity="0.54"/><circle cx="33" cy="29" r="0.5" fill="#ffd0d8" opacity="0.52"/><circle cx="82" cy="50" r="1.1" fill="#ffd0d8" opacity="0.57"/><circle cx="128" cy="32" r="0.8" fill="#ffd0d8" opacity="0.41"/><circle cx="67" cy="8" r="1.1" fill="#ffd0d8" opacity="0.73"/>
    <circle cx="128" cy="96" r="84" fill="url(#moon3)" opacity="0.95"/>
    <use xlink:href="#bat" transform="translate(52 44) scale(1.2)"/><use xlink:href="#bat" transform="translate(206 36)"/><use xlink:href="#bat" transform="translate(222 70) scale(0.7)"/><use xlink:href="#bat" transform="translate(30 84) scale(0.8)"/>
    <!-- 머리카락 (뒤) -->
    <path d="M84 104 C80 64 104 46 128 46 C152 46 176 64 172 104 L160 92 L128 72 L96 92 Z" fill="#0a0408"/>
    <!-- 얼굴 -->
    <path d="M128 64 C156 64 168 86 166 112 C164 138 148 160 128 166 C108 160 92 138 90 112 C88 86 100 64 128 64 Z" fill="url(#face3)" stroke="#2a0a18" stroke-width="2"/>
    <!-- 이마 V 머리선 -->
    <path d="M90 100 C96 78 112 66 128 90 C144 66 160 78 166 100 C162 74 148 58 128 58 C108 58 94 74 90 100 Z" fill="#0a0408"/>
    <use xlink:href="#halfV"/><use xlink:href="#halfV" transform="translate(256 0) scale(-1 1)"/>
    <path d="M128 120 L124 136 L128 138" stroke="#8a7a94" stroke-width="2" fill="none"/>
    <!-- 입 + 송곳니 -->
    <path d="M112 148 C120 152 136 152 144 148" stroke="#5a0614" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M116 149 L119 158 L122 150 Z M140 149 L137 158 L134 150 Z" fill="#fff"/>
    <path d="M118 158 L118 166" stroke="#e01b2f" stroke-width="1.6" opacity="0.8"/>
    <!-- 브로치 -->
    <circle cx="128" cy="186" r="8" fill="#e01b2f" stroke="#ffd23f" stroke-width="3" filter="url(#glow)"/>
    <rect width="256" height="256" fill="url(#vign)"/>
  </g>
  <rect x="3" y="3" width="250" height="250" rx="32" fill="none" stroke="#ff3a4a" stroke-width="5" opacity="0.9"/>
</svg>