    <path d="M104 182 L128 236 L152 182 L146 182 L128 222 L110 182 Z" fill="#e8e8ec"/>
    <!-- 얼굴 -->
    <path d="M128 92 C154 92 168 112 166 140 C164 168 148 186 128 190 C108 186 92 168 90 140 C88 112 102 92 128 92 Z" fill="url(#face4)" stroke="#20242c" stroke-width="2"/>
