    <ellipse cx="128" cy="100" rx="96" ry="18" fill="#05060a" stroke="#3a3e4a" stroke-width="1.5"/>
    <ellipse cx="128" cy="98" rx="96" ry="16" fill="none" stroke="#5a6070" stroke-width="1" opacity="0.5"/>
