<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 256 256">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0a1020" flood-opacity="0.5"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigglow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <clipPath id="rr"><rect x="0" y="0" width="256" height="256" rx="34"/></clipPath>
    <radialGradient id="vign" cx="50%" cy="45%" r="70%"><stop offset="0.55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.75"/></radialGradient>
    <radialGradient id="bg4" cx="50%" cy="40%" r="75%"><stop offset="0" stop-color="#2a3448"/><stop offset="0.6" stop-color="#0e1220"/><stop offset="1" stop-color="#030408"/></radialGradient>
    <radialGradient id="moon4" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#e8f0ff"/><stop offset="0.6" stop-color="#9ab0d0"/><stop offset="1" stop-color="#9ab0d0" stop-opacity="0"/></radialGradient>
    <radialGradient id="face4" cx="45%" cy="40%" r="70%"><stop offset="0" stop-color="#e4e6ea"/><stop offset="0.6" stop-color="#a8adb6"/><stop offset="1" stop-color="#4a4e58"/></radialGradient>
    <radialGradient id="eye4" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.4" stop-color="#b8e0ff"/><stop offset="1" stop-color="#5aa0ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="robe4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a1c24"/><stop offset="1" stop-color="#050608"/></linearGradient>
  </defs>
  <g clip-path="url(#rr)">
    <rect width="256" height="256" fill="url(#bg4)"/>
    <circle cx="200" cy="52" r="34" fill="url(#moon4)" opacity="0.8"/>
